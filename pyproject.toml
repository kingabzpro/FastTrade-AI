[project]
name = "fasttrade-ai"
version = "0.2.0"
description = "Research-oriented, signal-only trading decision CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # shortcut: pandas 3.1 warns in yfinance; lift the cap when yfinance removes inplace sort_index.
    "pandas>=2.2,<3.1",
    # shortcut: NumPy 2.5 warns in pandas 2.x; lift the cap when the pandas cap can be removed.
    "numpy<2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
    "rich>=13",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "slowapi>=0.1.10",
    "redis>=8.1.0",
    "tenacity>=9.1,<10",
]

[project.scripts]
ft = "fasttrade.cli:dashboard"

[project.urls]
Repository = "https://github.com/kingabzpro/FastTrade-AI"
Issues = "https://github.com/kingabzpro/FastTrade-AI/issues"

[project.optional-dependencies]
forecast = [
    "chronos-forecasting==2.3.2",
]

[dependency-groups]
dev = [
    "exchange-calendars==4.13.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fasttrade"]
