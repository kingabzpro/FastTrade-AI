[project]
name = "fasttrade-ai"
version = "0.1.0"
description = "Research-oriented, signal-only trading decision CLI"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
    "textual>=8.2.8",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ft = "fasttrade.cli:dashboard"
fasttrade = "fasttrade.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fasttrade"]
